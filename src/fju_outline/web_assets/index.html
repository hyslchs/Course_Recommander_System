<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>輔仁大學 115-1 課程大綱資料瀏覽</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">FJU</div>
          <div>
            <h1>課程大綱資料</h1>
            <p>115 學年度上學期</p>
          </div>
        </div>
        <div id="stats" class="stats-grid"></div>
        <div class="filters">
          <label>
            <span>關鍵字</span>
            <input id="query" type="search" placeholder="課名、教師、系別、代碼" />
          </label>
          <label>
            <span>系別</span>
            <select id="department"></select>
          </label>
          <label>
            <span>年級</span>
            <select id="grade"></select>
          </label>
          <label>
            <span>班別</span>
            <select id="classGroup" disabled></select>
          </label>
          <label>
            <span>部別</span>
            <select id="division"></select>
          </label>
          <label>
            <span>必選修</span>
            <select id="req"></select>
          </label>
          <label>
            <span>大綱狀態</span>
            <select id="done"></select>
          </label>
          <div class="filter-actions">
            <button id="resetBtn" class="secondary" type="button">↺ 重設</button>
            <button id="searchBtn" type="button">⌕ 搜尋</button>
          </div>
        </div>
      </aside>

      <main class="content">
        <section class="toolbar">
          <div>
            <h2>課程列表</h2>
            <p id="resultMeta">載入中</p>
          </div>
          <div class="table-tools">
            <select id="sort">
              <option value="name_zh">課程名稱</option>
              <option value="department_base_zh">系別</option>
              <option value="grade_sort">年級</option>
              <option value="class_sort">班別</option>
              <option value="primary_teacher_name_zh">教師</option>
              <option value="credits">學分</option>
            </select>
            <select id="pageSize">
              <option value="25">25 / 頁</option>
              <option value="50">50 / 頁</option>
              <option value="100">100 / 頁</option>
            </select>
          </div>
        </section>

        <section class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>課程</th>
                <th>教師</th>
                <th>系別</th>
                <th>年級</th>
                <th>班別</th>
                <th>學分</th>
                <th>選別</th>
                <th>狀態</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="courseRows"></tbody>
          </table>
        </section>

        <section class="pager">
          <button id="prevPage" class="secondary" type="button">←</button>
          <span id="pageMeta"></span>
          <button id="nextPage" class="secondary" type="button">→</button>
        </section>
      </main>
    </div>

    <section id="detailPanel" class="detail-panel" aria-hidden="true">
      <div class="detail-header">
        <div>
          <h2 id="detailTitle">課程詳情</h2>
          <p id="detailSubtitle"></p>
        </div>
        <button id="closeDetail" class="icon-button" type="button">×</button>
      </div>
      <div id="detailBody" class="detail-body"></div>
    </section>
    <div id="scrim" class="scrim"></div>

    <script src="/static/app.js"></script>
  </body>
</html>
