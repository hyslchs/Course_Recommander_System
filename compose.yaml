name: crs-production

services:
  crs-app:
    image: ${CRS_IMAGE_TAG:-crs-course-recommender:2026-08-27-1151-egemma-r57c266a-c9935a9392ab-g2ca6640}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - ./data/runtime:/app/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

networks:
  default:
    name: crs-production-network
    external: true
