[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-recommander-system"
version = "0.1.0"
description = "FJU course outline crawler and structured dataset pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.26",
  "orjson>=3.10",
  "pydantic>=2.0",
  "sentence-transformers>=3.0",
  "openai>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
pipeline = [
  "httpx>=0.27",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "scrapling[fetchers]>=0.2",
  "tenacity>=8.2",
  "tqdm>=4.66",
]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
fju-outline = "fju_outline.cli:main"
fju-outline-web = "fju_outline.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
