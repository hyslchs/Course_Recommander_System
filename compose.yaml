services:
  crs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crs-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - ./data/runtime:/app/data/runtime
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
